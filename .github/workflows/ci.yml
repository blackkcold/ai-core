name: CI and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Python quality checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile sources
        run: python -m compileall -q aicore tests
      - name: Run offline tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Install package
        run: python -m pip install -e .
      - name: CLI smoke checks
        run: |
          ai-core providers > /dev/null
          ai-core search-providers > /dev/null
          ai-core setup --provider deepseek --language python > /dev/null
          python -m aicore providers > /dev/null

  release:
    name: Publish GitHub Release v1.0.0
    runs-on: ubuntu-latest
    needs: [quality]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'chore(release): v1.0.0')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create version tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0 \
            --target "$GITHUB_SHA" \
            --title 'AI Core v1.0.0' \
            --notes-file RELEASE_NOTES.md \
            --latest
